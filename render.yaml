services:
  - type: web
    name: dsa-judge-backend
    env: node
    plan: free
    branch: main
    repo: https://github.com/Parth-star262/DSA-Judge
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && node prisma/cleanup.js && npx prisma db push --accept-data-loss && node prisma/seed.js
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JUDGE0_URL
        sync: false
      - key: JUDGE0_API_KEY
        sync: false

  - type: worker
    name: dsa-judge-worker
    env: node
    plan: free
    branch: main
    repo: https://github.com/Parth-star262/DSA-Judge
    rootDir: backend
    buildCommand: npm ci && npx prisma generate
    startCommand: npm run worker
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JUDGE0_URL
        sync: false
      - key: JUDGE0_API_KEY
        sync: false

# After importing this Blueprint, configure the same DATABASE_URL, REDIS_URL,
# and JWT_SECRET on both the web service and the background worker.
